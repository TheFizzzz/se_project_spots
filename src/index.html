<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots" />
    <meta name="author" content="Hunter Dominique" />
    <meta name="keywords" content="HTML, CSS, Image sharing, Social Media" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%= require('./images/spots-images/spots-icons/Logo.svg') %>"
          alt="Spots logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <img
              src="https://practicum-content.s3.amazonaws.com/resources/avatar_placeholder_1704989734.svg"
              alt="Profile avatar"
              class="profile__avatar profile__avatar_loading"
            />
            <button
              type="button"
              class="profile__avatar-edit-button"
              aria-label="Edit avatar"
            >
              <img
                src="<%= require('./images/spots-images/spots-icons/Pencil.svg') %>"
                alt=""
              />
              Edit Avatar
            </button>
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
              <img
                src="<%= require('./images/spots-images/spots-icons/Pencil.svg') %>"
                alt="Pencil Icon"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-button">
            <img
              src="<%= require('./images/spots-images/spots-icons/Plus.svg') %>"
              alt="Plus Icon"
            />
            New Post
          </button>
        </section>
        <div class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button type="button" class="card__delete-button"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button
                    type="button"
                    class="card__like-button"
                    aria-label="Like card"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </div>
      </main>
      <footer class="footer page__section">
        <p class="footer__text">2023 © Spots</p>
      </footer>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="<%= require('./images/spots-images/spots-icons/Close_Icon_Dark.svg') %>"
              alt="Close Icon"
            />
          </button>
          <h2 class="modal__title">New Post</h2>
          <form class="modal__form" novalidate>
            <label for="card-image-input" class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                required
                class="modal__input"
                placeholder="Paste a link to the picture"
              />
              <span class="modal__error" id="card-image-input-error"></span>
            </label>
            <label for="profile-caption-input" class="modal__label">
              Caption
              <input
                id="profile-caption-input"
                required
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
              />
              <span class="modal__error" id="profile-caption-input-error"></span>
            </label>
            <button type="submit" class="modal__button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="<%= require('./images/spots-images/spots-icons/Close_Icon_Dark.svg') %>"
              alt="Close Icon"
            />
          </button>
          <h2 class="modal__title">Edit Profile</h2>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                required
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
              />
              <span class="modal__error" id="profile-name-input-error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                required
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
              />
              <span
                class="modal__error"
                id="profile-description-input-error"
              ></span>
            </label>
            <button type="submit" class="modal__button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="edit-avatar-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="<%= require('./images/spots-images/spots-icons/Close_Icon_Dark.svg') %>"
              alt="Close Icon"
            />
          </button>
          <h2 class="modal__title">Edit Avatar</h2>
          <form class="modal__form" novalidate>
            <label for="avatar-link-input" class="modal__label">
              Profile Picture
              <input
                id="avatar-link-input"
                type="url"
                required
                class="modal__input"
                placeholder="Paste a link to the picture"
              />
              <span class="modal__error" id="avatar-link-input-error"></span>
            </label>
            <button type="submit" class="modal__button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="delete-card-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="<%= require('./images/spots-images/spots-icons/Close_Icon_Dark.svg') %>"
              alt="Close Icon"
            />
          </button>
          <h2 class="modal__title modal__title_type_center">
            Are you sure?
          </h2>
          <form class="modal__form modal__form_type_delete" novalidate>
            <button
              type="submit"
              class="modal__button modal__button_type_delete"
            >
              Delete
            </button>
            <button
              type="button"
              class="modal__button modal__button_type_cancel"
            >
              Cancel
            </button>
          </form>
        </div>
      </div>
      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            type="button"
            class="modal__close-button modal__close-button_type_preview"
            aria-label="Close Modal"
          >
            <img
              src="<%= require('./images/spots-images/spots-icons/Close_Icon_Light.svg') %>"
              alt="Close Icon"
            />
          </button>
          <img src="#" alt="" class="modal__image" />
          <h2 class="modal__title"></h2>
        </div>
      </div>
    </div>
  </body>
</html>
